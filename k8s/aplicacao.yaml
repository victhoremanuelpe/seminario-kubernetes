apiVersion: v1
kind: Namespace
metadata:
  name: t05-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: t05-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: t05-demo
spec:
  type: NodePort
  selector:
    app: site
  ports:
    - name: http
      port: 80
      targetPort: http